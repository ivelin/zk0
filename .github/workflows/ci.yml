name: CI

on:
  push:
  pull_request:

jobs:
  self-check:
    name: CI self-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run base self-check against this tree
      env:
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        ZK0_ROOT: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BASE="${GITHUB_BASE_SHA:-}"
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          BASE="${GITHUB_EVENT_BEFORE:-}"
        fi
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "self-check: missing base SHA"
          exit 1
        fi
        mkdir -p /tmp/zk0-base-ci
        if git cat-file -e "${BASE}:ci/self_check.py"; then
          git show "${BASE}:ci/self_check.py" > /tmp/zk0-base-ci/self_check.py
          if git cat-file -e "${BASE}:ci/allowed_skips.txt"; then
            git show "${BASE}:ci/allowed_skips.txt" > /tmp/zk0-base-ci/allowed_skips.txt
          else
            : > /tmp/zk0-base-ci/allowed_skips.txt
          fi
          export ZK0_ALLOWLIST=/tmp/zk0-base-ci/allowed_skips.txt
          python3 /tmp/zk0-base-ci/self_check.py
        else
          echo "self-check: base ${BASE} has no ci/self_check.py; running HEAD bootstrap"
          python3 ci/self_check.py
        fi
        python3 ci/test_self_check.py

  test:
    name: ${{ matrix.test-type }} UnitTests
    needs: self-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test-type: all
            python-version: '3.10'
            test-path: tests/unit
            cov-fail-under: 30
            parallel: 0
            flags: unit-tests

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.ci
        load: true
        tags: zk0-ci:bookworm

    - name: Run ${{ matrix.test-type }} tests in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -e CUDA_VISIBLE_DEVICES="" \
          zk0-ci:bookworm \
          bash -c "
            cd /workspace &&
            export CI=true &&
            uv pip install --system --constraint ci/constraints.txt -e '.[test]' &&
            pytest ${{ matrix.test-path }} -x --tb=short --durations=10 -n ${{ matrix.parallel }}
          "
