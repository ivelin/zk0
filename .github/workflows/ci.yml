name: CI

on:
  push:
  pull_request:

jobs:
  self-check:
    name: CI self-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fail on new unit-test skips or a neutered CI workflow
      env:
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python3 ci/self_check.py

  test:
    name: ${{ matrix.test-type }} UnitTests
    needs: self-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test-type: all
            python-version: '3.10'
            test-path: tests/unit
            cov-fail-under: 30
            parallel: 0
            flags: unit-tests

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.ci
        load: true
        tags: zk0-ci:bookworm

    - name: Run ${{ matrix.test-type }} tests in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -e CUDA_VISIBLE_DEVICES="" \
          zk0-ci:bookworm \
          bash -c "
            cd /workspace &&
            export CI=true &&
            uv pip install --system --constraint ci/constraints.txt -e '.[test]' &&
            pytest ${{ matrix.test-path }} -x --tb=short --durations=10 -n ${{ matrix.parallel }}
          "
