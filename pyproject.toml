    {name = "armnet/armnetbench_v01_lerobot_so101", description = "Study 001 node 2 - ring_insert (P0 subset, 50 teleop demos, 11679 frames)", client_id = 2, root = "/home/openclaw/muse-work/zk0-onarm-20261117/data/armnetbench_v01_lerobot_so101", episodes_file = "/home/openclaw/muse-work/zk0-study001-20261119/subsets/ring_insert/episodes.json"},
    {name = "armnet/armnetbench_v01_lerobot_so101", description = "Study 001 node 3 - tool_insert (P0 subset, 50 teleop demos, 20806 frames)", client_id = 3, root = "/home/openclaw/muse-work/zk0-onarm-20261117/data/armnetbench_v01_lerobot_so101", episodes_file = "/home/openclaw/muse-work/zk0-study001-20261119/subsets/tool_insert/episodes.json"},
    {name = "armnet/armnetbench_v01_lerobot_so101", description = "Study 001 node 4 - cable_clip (P0 subset, 50 teleop demos, 27647 frames)", client_id = 4, root = "/home/openclaw/muse-work/zk0-onarm-20261117/data/armnetbench_v01_lerobot_so101", episodes_file = "/home/openclaw/muse-work/zk0-study001-20261119/subsets/cable_clip/episodes.json"},
]
